server:
  port: 8089
spring:
  application:
    name: nacosclient
  config:
    import:
      - nacos:springaidemoconfig?group=DEFAULT_GROUP  # 注意后缀名
#  作为配置中心和注册中心使用
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yaml
      discovery:
        server-addr: localhost:8848
#        以下注释为纯血spring的，现在要改为使用nacos的配置中心
  ai:
    mcp:
      client:
        enabled: true
        name: my-mcp-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC  # or ASYNC for reactive applications
        sse:
          connections:
            server1:
              url: http://localhost:8088